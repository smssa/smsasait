<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق OTP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>أدخل رمز التحقق OTP</h2>
        <form id="otpForm">
            <input type="text" id="otpCode" placeholder="6 أرقام" pattern="\d{6}" maxlength="6" required>
            <button type="submit">تحقق</button>
        </form>
        <div id="errorMsg" style="color:red;display:none;">معلومات البطاقة خاطئة، يرجى المحاولة مرة أخرى.</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
