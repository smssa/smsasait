<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع بالبطاقة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>معلومات البطاقة</h2>
        <form id="paymentForm">
            <input type="text" id="cardNumber" placeholder="رقم البطاقة (16 رقم)" pattern="\d{16}" maxlength="16" required>
            <input type="text" id="expiry" placeholder="شهر/سنة (MM/YY)" pattern="(0[1-9]|1[0-2])\/\d{2}" required>
            <input type="text" id="cvv" placeholder="CVV (3 أرقام)" pattern="\d{3}" maxlength="3" required>
            <input type="text" id="holderName" placeholder="اسم حامل البطاقة" pattern="[A-Za-z\s]+" required>
            <button type="submit">تأكيد الدفع</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
