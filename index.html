<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMSA Express - تتبع شحنتك</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="SMSA Express" class="logo">
        <h1>تتبع شحنتك</h1>
        <form id="trackForm">
            <input type="text" id="trackingNumber" placeholder="أدخل رقم التتبع" pattern="[0-9]+" required>
            <button type="submit">تتبع الآن</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
